<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Beetle Bash — a free beetle-themed deck-building card game from GardenCalc. Play poker hands with garden bugs, beat the blinds, and collect joker critters." />
  <title>Beetle Bash — A Beetle Deck-Building Game | GardenCalc</title>
  <link rel="canonical" href="https://gardencalc.net/beetle-game.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GardenCalc" />
  <meta property="og:title" content="Beetle Bash — A Beetle Deck-Building Game" />
  <meta property="og:description" content="A free beetle-themed deck-building card game. Play poker hands with garden bugs, beat the blinds, collect jokers." />
  <meta property="og:url" content="https://gardencalc.net/beetle-game.html" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪲</text></svg>" />
  <link rel="stylesheet" href="beetle-game.css" />
</head>
<body class="beetle">

  <header class="topbar">
    <div class="brand">🪲 Beetle <span>Bash</span></div>
    <a href="index.html">← Back to GardenCalc</a>
  </header>

  <main class="game">

    <!-- HUD -->
    <section class="hud">
      <div class="panel blind-panel">
        <div class="blind-label" id="blind-label">Small Blind</div>
        <div class="blind-name" id="blind-name">—</div>
        <div class="blind-desc" id="blind-desc"></div>
        <div class="blind-need">Score at least <b id="blind-target">0</b></div>
        <div class="blind-reward-row">Reward <b id="blind-reward">$0</b></div>
      </div>

      <div class="panel score-panel">
        <div class="score-label">Round Score</div>
        <div class="score-val" id="round-score">0</div>
        <div class="stats">
          <div class="stat"><div class="n" id="ante">1/8</div><div class="k">Ante</div></div>
          <div class="stat hands"><div class="n" id="hands-left">4</div><div class="k">Hands</div></div>
          <div class="stat discards"><div class="n" id="discards-left">3</div><div class="k">Discards</div></div>
          <div class="stat money"><div class="n" id="money">$4</div><div class="k">Cash</div></div>
          <div class="stat"><div class="n" id="deck-count">44</div><div class="k">Deck</div></div>
        </div>
      </div>
    </section>

    <!-- Jokers -->
    <section class="panel jokers-wrap">
      <div class="jokers-head">Bugs<br><span id="joker-count">0/5</span></div>
      <div class="jokers" id="jokers"></div>
    </section>

    <!-- Score readout -->
    <section class="readout" id="readout">
      <div class="r-hand" id="r-hand"></div>
      <div class="rc">
        <span class="box r-chips" id="r-chips">0</span>
        <span class="x">×</span>
        <span class="box r-mult" id="r-mult">0</span>
      </div>
      <div class="r-total" id="r-total"></div>
    </section>

    <!-- Hand -->
    <section class="hand-area">
      <div class="preview" id="preview"><span class="muted">Select cards to see the hand</span></div>
      <div class="hand" id="hand"></div>
    </section>

    <!-- Controls -->
    <section class="controls">
      <button class="btn btn-play" id="btn-play">Play Hand</button>
      <button class="btn btn-discard" id="btn-discard">Discard</button>
      <button class="btn" id="btn-sort-rank">Sort: Rank</button>
      <button class="btn" id="btn-sort-family">Sort: Family</button>
    </section>
    <p class="hint">Click cards to select (max 5). &nbsp;·&nbsp; Enter = Play &nbsp;·&nbsp; Space = Discard &nbsp;·&nbsp; Click a bug to sell it.</p>

  </main>

  <!-- Shop -->
  <div class="shop" id="shop">
    <div class="shop-inner">
      <h2>The Bug Shop</h2>
      <div class="shop-money-row">Cash: <b id="shop-money">$0</b></div>
      <div class="shop-items" id="shop-items"></div>
      <div class="shop-actions">
        <button class="btn btn-reroll" id="btn-reroll">Reroll <span id="reroll-cost">$5</span></button>
        <button class="btn btn-primary" id="btn-leave-shop">Next Blind →</button>
      </div>
    </div>
  </div>

  <!-- Overlay -->
  <div class="overlay dim" id="overlay">
    <div class="overlay-content" id="overlay-content"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="beetle-game.js"></script>
</body>
</html>
